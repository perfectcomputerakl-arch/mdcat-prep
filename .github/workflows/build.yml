name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }

      - uses: subosito/flutter-action@v2
        with: { channel: stable }

      - name: Create Android project files around our code
        run: |
          mkdir /tmp/bak
          cp -r lib assets pubspec.yaml /tmp/bak/
          flutter create --platforms=android --project-name mdcat_prep --org com.mdcatprep .
          rm -rf lib assets pubspec.yaml test
          cp -r /tmp/bak/lib /tmp/bak/assets /tmp/bak/pubspec.yaml .

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with: { name: mdcat-prep-apk, path: build/app/outputs/flutter-apk/app-debug.apk }
